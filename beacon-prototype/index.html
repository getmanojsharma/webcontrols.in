<!doctype html>

<title>Beacon CrewSuite Prototype</title>

<style>
@page{size:297mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B2545;--navy2:#13315C;--ocean:#1D4E89;--teal:#0FA3B1;--teal-l:#E3F6F7;--bg:#F3F6FA;--line:#E2E8F0;--ink:#1A2433;--mut:#64748B;--red:#D64545;--grn:#2E9E6A}
html,body{background:#55657a;font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:297mm;height:210mm;background:#fff;margin:18px auto;position:relative;overflow:hidden;padding:14px 28px 0;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25);break-after:page;page-break-after:always}
@media print{html,body{background:#fff}.page{margin:0;box-shadow:none}}
.ph{display:flex;justify-content:space-between;align-items:center;height:50px;border-bottom:2px solid var(--navy);margin-bottom:12px;flex:none}
.ph-l{display:flex;gap:12px;align-items:center}
.ph-no{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:7px;padding:6px 9px;letter-spacing:.5px}
.ph h2{font-size:18px;color:var(--navy);font-weight:800;letter-spacing:-.2px}
.ph p{font-size:11px;color:var(--mut);margin-top:2px}
.ph-r{font-size:10px;color:var(--mut);text-align:right;font-weight:600;letter-spacing:.3px;line-height:1.5}
.ph-r b{color:var(--teal)}
.pb{flex:1;min-height:0;display:flex;gap:16px}
.pb.full{flex-direction:column;gap:10px}
.pf{height:26px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:9px;color:#94a3b8;border-top:1px solid var(--line);margin-top:8px;flex:none}
.shot{border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(15,35,70,.12);background:#fff;flex:none;align-self:flex-start}
.bar{height:24px;background:#e9eef5;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid #d5dde8}
.bar i{width:8px;height:8px;border-radius:50%;background:#f87171}.bar i:nth-child(2){background:#fbbf24}.bar i:nth-child(3){background:#34d399}
.bar span{margin-left:12px;background:#fff;border-radius:5px;padding:2px 12px;font-size:9.5px;color:#475569;flex:1;max-width:420px}
.notes{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.notes h4{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal);font-weight:800;margin-bottom:2px}
.note{display:flex;gap:8px;font-size:10.3px;line-height:1.45;color:#334155}
.note b{color:var(--navy)}
.note .n,.mk{flex:none;width:17px;height:17px;border-radius:50%;background:#F43F5E;color:#fff;font-size:9.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.app .mk{width:23px;height:23px;font-size:12.5px;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(244,63,94,.5);vertical-align:middle}
.full .notes{flex-direction:row;flex-wrap:wrap;gap:5px 18px;flex:none}
.full .notes h4{width:100%}
.full .note{width:calc(33.33% - 12px)}
.tip{margin-top:auto;background:var(--teal-l);border-radius:10px;padding:10px 12px;font-size:10.3px;line-height:1.5;color:#0B5C66}
.tip b{color:#06464E}

.by{display:inline-flex;align-items:center;gap:6px;color:#475569;font-weight:600;font-size:9.5px}.by b{color:var(--navy);font-weight:800}.by a{color:var(--teal);text-decoration:none;font-weight:700;padding-left:7px;border-left:1px solid #CBD5E1}
.wc{width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,#0B2545,#0FA3B1);color:#fff;font-size:7.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.3px;flex:none}
.by.dk{color:#cfe0f1;font-size:11px}.by.dk b{color:#fff}.by.dk a{color:#5EEAD4;border-color:rgba(255,255,255,.3)}.by.dk .wc{width:22px;height:22px;font-size:9px}
@media screen{#doc{zoom:var(--fit,1)}}
/* ===== APP ===== */
.app{display:flex;background:var(--bg);font-size:13px;overflow:hidden;position:relative}
.side{width:224px;flex:none;background:linear-gradient(180deg,#0B2545 0%,#102D52 60%,#0E3A5C 100%);color:#c9d6e6;padding:16px 0;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.lg{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0FA3B1,#1D4E89);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand b{display:block;color:#fff;font-size:14.5px;letter-spacing:.4px}.brand small{font-size:10.5px;color:#8fb3d1}
.sec{font-size:9.5px;letter-spacing:1.4px;color:#6f8fb0;font-weight:700;padding:14px 20px 5px}
.mi{display:flex;align-items:center;gap:10px;padding:7.5px 18px;font-size:12.8px;color:#c9d6e6;border-left:3px solid transparent}
.mi.on{background:rgba(15,163,177,.18);color:#fff;border-left-color:#0FA3B1;font-weight:600}
.mi .cnt{margin-left:auto;background:#D64545;color:#fff;font-size:10px;border-radius:10px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;padding:12px 18px 0;font-size:10.5px;color:#6f8fb0;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px;flex:none}
.top h1{font-size:18px;font-weight:700;color:var(--navy);line-height:1.2}
.crumb{font-size:11px;color:var(--mut)}
.srch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:240px;color:#94a3b8;font-size:12px}
.tb-i{position:relative;color:#475569;display:flex}.tb-i em{position:absolute;top:-7px;right:-9px;background:#D64545;color:#fff;font-style:normal;font-size:9px;border-radius:8px;padding:0 5px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.25}.who small{color:var(--mut);font-size:10.5px}
.av{width:32px;height:32px;border-radius:50%;background:#1D4E89;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.content{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:13px;min-height:0;overflow:hidden}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.ch h3{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.sub{font-size:11.5px;color:var(--mut);font-weight:400}
.row{display:flex;gap:13px;min-height:0}.col{display:flex;flex-direction:column;gap:13px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;position:relative;overflow:hidden}
.kpi .l{font-size:11px;color:var(--mut);font-weight:600}.kpi .v{font-size:25px;font-weight:800;color:var(--navy);margin-top:3px;line-height:1.15}.kpi .s{font-size:10.5px;color:var(--mut)}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,#1D4E89)}
.kpi .ic{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--kb,#E0ECFF);color:var(--k,#1D4E89)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{background:#F1F5F9;color:#475569;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:6.5px 8px;border-bottom:1px solid #EEF2F7;white-space:nowrap}
.t td.r,.t th.r{text-align:right}.t td.c,.t th.c{text-align:center}
.t tr.tot td{font-weight:800;background:#F1F5F9;border-top:2px solid var(--navy);color:var(--navy)}
.t tr.hl td{background:#FFF7F7}
.t.pay td{padding:3.5px 5px;font-size:10.9px;line-height:1.2}.t.pay th{padding:6px 5px;font-size:9px}
.t.sm{font-size:11.3px}.t.sm td{padding:5.5px 7px}.t.sm th{padding:6px 7px;font-size:9.5px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.3}
.chip b{font-weight:800}
.c-over{background:#7F1D1D;color:#fff}.c-red{background:#FDE2E2;color:#B42318}.c-org{background:#FFEBD9;color:#B54708}.c-amb{background:#FEF3C7;color:#92400E}.c-blue{background:#E0ECFF;color:#1D4ED8}.c-grn{background:#DCF5E7;color:#18794E}.c-grey{background:#EEF2F7;color:#475569}.c-teal{background:var(--teal-l);color:#0B7A85}.c-navy{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;border:1px solid #CBD5E1;background:#fff;color:var(--navy);white-space:nowrap}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.t{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.d{background:#D64545;color:#fff;border-color:#D64545}.btn.g{background:var(--grn);color:#fff;border-color:var(--grn)}.btn.sm{padding:3px 8px;font-size:10.5px;border-radius:6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.fg.c3{grid-template-columns:1fr 1fr 1fr}
.f label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:4px}
.f label em{color:#D64545;font-style:normal}
.f .i{border:1px solid #CBD5E1;border-radius:8px;padding:7px 10px;font-size:12.5px;background:#fff;display:flex;align-items:center;justify-content:space-between;min-height:33px;gap:6px}
.f .i.ro{background:#F1F5F9;color:#334155;border-style:dashed}
.f .i.dd:after{content:'\25BE';color:#94a3b8;font-size:11px}
.f .i.ph{color:#94a3b8}
.f .h{font-size:10.5px;color:var(--mut);margin-top:3px}
.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}
.up{border:1.5px dashed #94a3b8;border-radius:8px;padding:7px 10px;font-size:12px;color:#475569;display:flex;align-items:center;gap:8px;background:#F8FAFC;min-height:33px}
.up.ok{border-color:#2E9E6A;background:#F0FBF5;color:#18794E}
.seg{display:inline-flex;border:1px solid #CBD5E1;border-radius:8px;overflow:hidden;background:#fff}.seg span{padding:7px 11px;font-size:11.5px;border-right:1px solid #CBD5E1;white-space:nowrap}.seg span:last-child{border:0}.seg .on{background:var(--navy);color:#fff;font-weight:600}
.pbar{height:6px;background:#E2E8F0;border-radius:4px;overflow:hidden;min-width:70px}.pbar i{display:block;height:100%;border-radius:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}.tabs span{padding:8px 13px;font-size:12.5px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}.tabs .on{color:var(--navy);border-bottom-color:var(--teal)}
.muted{color:var(--mut)}.b{font-weight:700}.red{color:#B42318}.grn{color:#18794E}
.alert{display:flex;align-items:center;gap:12px;border-radius:10px;padding:9px 14px;font-size:12.5px}
.alert.red{background:#FEF2F2;border:1px solid #FECACA;color:#7F1D1D}
.alert.amb{background:#FFFBEB;border:1px solid #FDE68A;color:#78350F}
.alert.grn{background:#F0FBF5;border:1px solid #BBE7CF;color:#14532D}
.alert.blu{background:#EFF6FF;border:1px solid #C7DBFF;color:#1E3A8A}
.alert .btn{margin-left:auto}
.nm{display:flex;align-items:center;gap:8px}.nm small{display:block;color:var(--mut);font-size:10.5px;font-weight:400}
.ini{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:#1D4E89;flex:none}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid #CBD5E1;border-radius:20px;padding:4px 11px;font-size:11.5px;color:#334155;background:#fff;display:inline-flex;gap:5px;align-items:center}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}.kv span{color:var(--mut)}.kv b{color:var(--ink);font-weight:600}
.vc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.vc .vh{display:flex;justify-content:space-between;align-items:center}
.vc .vh b{font-size:13.5px;color:var(--navy)}
.vc .cr{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;padding:4px 0;border-top:1px dashed #E5EAF1;gap:6px}
.vc .cr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc .cr small{color:var(--mut);font-size:10px}
.overlay{position:absolute;inset:0;background:rgba(11,37,69,.55);display:flex;align-items:center;justify-content:center}
.modal{width:700px;background:#fff;border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden}
.mh{background:linear-gradient(135deg,#0B2545,#1D4E89);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px}
.mh h3{font-size:17px}.mh p{font-size:11.5px;color:#b8cde4}
.msec{padding:12px 22px;border-bottom:1px solid var(--line)}
.msec h5{font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.mrow{display:flex;align-items:center;gap:10px;font-size:12.3px;padding:5px 0}
.mrow .x{margin-left:auto;display:flex;gap:8px;align-items:center}
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tli{display:flex;gap:12px;padding-bottom:12px;position:relative}
.tli:before{content:'';position:absolute;left:9px;top:20px;bottom:0;width:2px;background:#E2E8F0}
.tli:last-child:before{display:none}
.tld{width:20px;height:20px;border-radius:50%;flex:none;border:4px solid #fff;box-shadow:0 0 0 2px var(--c,#1D4E89);background:var(--c,#1D4E89)}
.perm td.c{font-size:13px}
/* cover & doc pages */
.cover{padding:0;background:linear-gradient(135deg,#071A33 0%,#0B2545 45%,#14466F 100%);color:#fff}
.doc h3{font-size:14px;color:var(--navy);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.doc p,.doc li{font-size:11px;line-height:1.55;color:#334155}
.doc ul{padding-left:16px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.flow{display:flex;align-items:stretch;gap:0}
.step{flex:1;background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:11px 10px;position:relative;text-align:center}
.step .sn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.step b{display:block;font-size:11.2px;color:var(--navy);margin-bottom:3px}
.step span{font-size:9.6px;color:var(--mut);line-height:1.4;display:block}
.arr{width:18px;display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:800;flex:none}
.fx{background:#0B2545;color:#fff;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;line-height:1.6}
.fx em{font-style:normal;color:#5EEAD4}
.ex td{font-size:10.5px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:9px 12px;background:#fff}
.q>b{font-size:11.3px;color:var(--navy);display:block;margin-bottom:3px}
.q p{font-size:10.4px;line-height:1.5;color:#475569}
.q .ans{margin-top:5px;font-size:10px;color:#0B7A85;font-weight:600}
</style>

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>{const d=typeof s==='string'?D(s):s;return String(d.getDate()).padStart(2,'0')+'-'+MON[d.getMonth()]+'-'+d.getFullYear()};
const fs=s=>{const d=D(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
const dd=(a,b)=>Math.round((D(b)-D(a))/864e5);
const left=e=>Math.round((D(e)-TODAY)/864e5);
const num=n=>Math.round(n).toLocaleString('en-IN');
const inr=n=>'₹'+num(n);
const mask=p=>p?p.slice(0,5)+'••••'+p.slice(9):'<span class="chip c-red" style="font-size:10px">PAN missing</span>';
const ini=n=>n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('');
const COL=['#1D4E89','#0FA3B1','#7C3AED','#B45309','#0E7490','#BE185D','#15803D','#4338CA'];
const av=n=>`<span class="ini" style="background:${COL[n.length%COL.length]}">${ini(n)}</span>`;
const mk=n=>`<span class="mk">${n}</span>`;
function chip(d){
  if(d<0)return `<span class="chip c-over">${ic('alert',11,2.5)} OVERSTAY +${-d} days</span>`;
  if(d===0)return `<span class="chip c-over">ENDS TODAY</span>`;
  const c=d<=7?'c-red':d<=15?'c-org':d<=30?'c-amb':d<=60?'c-blue':'c-grn';
  return `<span class="chip ${c}"><b>${d}</b> days left</span>`;
}
function medChip(e){const d=left(e);if(d<0)return `<span class="chip c-over">EXPIRED</span>`;if(d<=30)return `<span class="chip c-red">Expires in ${d} d</span>`;if(d<=60)return `<span class="chip c-amb">Valid · ${d} d</span>`;return `<span class="chip c-grn">${ic('check',11,3)} VALID</span>`}
const taxLbl={'10':'TDS 10%','2':'TDS 2%','20':'TDS 20%','NIL':'In-Hand'};
const taxChip=t=>`<span class="chip ${t==='NIL'?'c-grey':t==='20'?'c-red':t==='2'?'c-teal':'c-blue'}" style="font-size:10px">${taxLbl[t]}</span>`;
const prog=(s,e)=>{const tot=dd(s,e),el=Math.max(0,Math.min(tot,dd(s,'2026-10-06')));const p=Math.round(el/tot*100);const l=left(e);const c=l<0?'#7F1D1D':l<=7?'#D64545':l<=15?'#EA7A2E':l<=30?'#E8A33D':'#2E9E6A';return `<div class="pbar"><i style="width:${Math.min(100,p)}%;background:${c}"></i></div>`};

 <p>Beacon Marine places crew on many vessels on fixed-term contracts (30 days, 60 days, months, or day-rate). Today the contracts and salaries are kept in separate Excel sheets, so it is easy to <b>miss a contract end date</b>. When that happens the crew member stays on board, salary keeps running unnoticed, and the month-end salary and TDS sheets have to be built by hand for every vessel.</p></div>
 <div class="box"><h3>${ic('check',17)} What CrewSuite delivers</h3>
 <ul><li><b>Live countdown</b> of days left on every contract, vessel-wise, with colour alerts (60 / 30 / 15 / 7 days) and an <b>OVERSTAY</b> flag when a contract has ended but the crew is still on board.</li>
 <li><b>Login pop-up</b> listing contracts and medical certificates that are about to expire, so nothing gets missed.</li>
 <li><b>Sign-On → Sign-Off workflow</b>: salary runs from the actual join date to the actual exit date, and even a single extra day is paid and shown.</li>
 <li><b>Automatic monthly payroll</b> per vessel, in the same columns as your current Excel: pro-rata salary, TDS 10% / 2% / 20%, PF, leave, conveyance, advance, net payment.</li>
 <li><b>Available crew pool</b>: crew who have signed off show as free to assign to another vessel, with their medical status.</li>
 <li><b>One-click reports</b>: TDS report for the CA, vessel cost sheets, and Excel downloads every month.</li></ul></div>

</div>
